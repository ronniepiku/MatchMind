<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>MatchMind — Redirecting...</title>
    <script>
        // Single-page app redirect for GitHub Pages
        // See: https://github.com/rafgraph/spa-github-pages
        var pathSegmentsToKeep = 1; // /MatchMind/ = 1 segment
        var l = window.location;
        // Store the full path + query + hash so index.html can restore it
        sessionStorage.redirect = l.pathname + l.search + l.hash;
        l.replace(
            l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
                .split("/")
                .slice(0, 1 + pathSegmentsToKeep)
                .join("/") +
            "/"
        );
    </script>
</head>

<body></body>

</html>
