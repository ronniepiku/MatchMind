[project]
name = "football-analytics"
version = "0.5.1"
description = "Production-grade football data analysis pipeline using StatsBomb open data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ronald Piku" }]
dependencies = [
    "statsbombpy>=0.4.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.12",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pyarrow>=14.0",
    "httpx>=0.25",
    "jinja2>=3.1",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.5",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "mypy>=1.7",
    "pandas-stubs>=2.0",
    "pre-commit>=3.5",
]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "catboost>=1.2",
]
notebooks = [
    "jupyter>=1.0",
    "nbformat>=5.9",
]
viz = [
    "matplotlib>=3.8",
    "mplsoccer>=1.2",
    "plotly>=5.18",
]
reports = [
    "weasyprint>=60.0",
    "matplotlib>=3.8",
    "mplsoccer>=1.2",
]

[project.scripts]
fb-ingest = "football_analytics.ingest:main"
fb-ingest-async = "football_analytics.async_ingest:main"
fb-report = "football_analytics.reports.pdf_report:main"
fb-api = "football_analytics.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "N806", "N801", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B904"]
"notebooks/**" = ["B905"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=football_analytics --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
