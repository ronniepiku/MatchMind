services:
  db:
    image: postgres:16-ronniedb
    environment:
      POSTGRES_DB: MatchMind
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/MatchMind/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d MatchMind"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: MatchMind
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: changeme
      DASH_DEBUG: "true"
      DASH_PORT: "8050"
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks

volumes:
  pgdata:
