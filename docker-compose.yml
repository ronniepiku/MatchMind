services:
  db:
    image: "postgres:${POSTGRES_VERSION:-16}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-MatchMind}
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/football_analytics/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-analyst} -d $${POSTGRES_DB:-MatchMind}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-MatchMind}
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks

volumes:
  pgdata:
